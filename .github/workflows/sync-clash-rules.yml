name: Sync Clash Rules

on:
  schedule:
    - cron: '23 22 * * *' # 每天北京时间 06:23 / 日本时间 07:23，避开整点
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-clash-rules.yml'
      - 'scripts/check_rules.py'
      - 'scripts/sync_rules.py'
      - 'config/substore_template.yaml'
      - 'custom/**'

permissions:
  contents: write

concurrency:
  group: sync-clash-rules
  cancel-in-progress: false

jobs:
  sync_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: target

      - uses: actions/checkout@v4
        with:
          repository: blackmatrix7/ios_rule_script
          ref: master
          path: upstream
          sparse-checkout: rule/Clash
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install YAML validator
        run: python -m pip install PyYAML==6.0.3

      - name: Validate upstream and sync referenced files only
        run: |
          python target/scripts/sync_rules.py target upstream
          python target/scripts/check_rules.py target

      - name: Commit validated rule updates
        working-directory: target
        shell: bash
        run: |
          set -euo pipefail
          git add -- list/
          if git diff --cached --quiet; then
            echo "No rule changes."
            exit 0
          fi
          upstream_sha=$(git -C ../upstream rev-parse HEAD)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update referenced rules from blackmatrix7 (${upstream_sha:0:12})"
          git push origin HEAD:main
